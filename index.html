<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11121d">
<title>Hoàng Kun iOS | App Library</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root{
 --bg:#11121d;
 --card:#1c1e2d;
 --text:#f5f5ff;
 --muted:#a0a6bd;
 --primary:#6265ff;
 --secondary:#c03ef3;
 --shadow:0 8px 25px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
 font-family:'Quicksand',sans-serif;
 background:var(--bg);
 color:var(--text);
 min-height:100vh;
 overflow-x:hidden;
 transition:background .3s,color .3s;
}
body.light{
 --bg:#f5f6ff;
 --card:#fff;
 --text:#191a30;
 --muted:#8991aa;
 --shadow:0 8px 25px rgba(55,65,120,.13);
}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer}

/* BACKGROUND */
body:before{
 content:"";
 position:fixed;
 inset:0;
 z-index:-2;
 pointer-events:none;
 background:
 radial-gradient(ellipse at 15% 10%,#777bff35,transparent 35%),
 radial-gradient(ellipse at 85% 20%,#d45bff30,transparent 35%),
 radial-gradient(ellipse at 50% 90%,#46caff20,transparent 40%);
 animation:bgMove 12s ease-in-out infinite alternate;
}
@keyframes bgMove{
 from{transform:translateY(-15px)}
 to{transform:translateY(15px)}
}

/* SAO ROI */
#particles{
 position:fixed;
 inset:0;
 overflow:hidden;
 pointer-events:none;
 z-index:50;
}
.particle{
 position:absolute;
 top:-30px;
 opacity:0;
 animation:fall linear infinite;
 text-shadow:0 0 12px currentColor;
 will-change:transform,opacity;
}
@keyframes fall{
 0%{transform:translate3d(0,-30px,0) rotate(0deg);opacity:0}
 10%{opacity:.8}
 80%{opacity:.65}
 100%{transform:translate3d(var(--drift),110vh,0) rotate(360deg);opacity:0}
}

/* NAVBAR */
.navbar{
 height:53px;
 position:sticky;
 top:0;
 z-index:100;
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:0 22px;
 background:#171827dd;
 backdrop-filter:blur(20px);
 -webkit-backdrop-filter:blur(20px);
 border-bottom:1px solid #ffffff12;
}
.light .navbar{background:#ffffffbb}
.nav-btn{
 width:38px;
 height:38px;
 border:0;
 border-radius:50%;
 background:transparent;
 font-size:17px;
 transition:.2s;
}
.nav-btn:hover{background:#8882;transform:scale(1.1)}
.bell{color:#6175ff}
.theme{color:#ff9e00}

/* PROFILE */
.hero{
 text-align:center;
 padding:40px 15px 45px;
 position:relative;
}

/* AVATAR + MŨ TRÙM */
.avatar-wrap{
 position:relative;
 width:140px;
 height:140px;
 margin:0 auto 5px;
 overflow:visible;
}

/* ẢNH CHÂN DUNG */
.avatar{
 position:absolute;
 width:94px;
 height:94px;
 top:53%;
 left:50%;
 transform:translate(-50%,-50%);
 object-fit:cover;
 object-position:center;
 border:0;
 border-radius:50%;
 box-shadow:none;
 z-index:2;
}

/* MŨ TRÙM PNG PHỦ BÊN NGOÀI */
.avatar-frame{
 position:absolute;
 top:50%;
 left:50%;
 width:140px;
 height:140px;
 transform:translate(-50%,-50%);
 object-fit:contain;
 pointer-events:none;
 z-index:3;
}

/* ẨN KHUNG KHI KHÔNG CÓ ẢNH */
.avatar-frame:not([src]),
.avatar-frame[src=""]{display:none}

/* MOBILE */
@media(max-width:600px){
 .avatar-wrap{width:130px;height:130px}
 .avatar{width:88px;height:88px;top:53%}
 .avatar-frame{width:130px;height:130px}
}
 
.hello{
 color:var(--muted);
 font-size:13px;
 margin-top:5px;
}
.hero h1{
 font-size:23px;
 font-weight:800;
 margin-top:5px;
 letter-spacing:-.4px;
 display:flex;
 align-items:center;
 justify-content:center;
 gap:7px;
}

/* DẤU TÍCH XANH */
.verified{
 width:19px;
 height:19px;
 display:inline-flex;
 align-items:center;
 justify-content:center;
 flex-shrink:0;
 border-radius:50%;
 background:#2196f3;
 color:#fff;
 font-size:11px;
 box-shadow:0 2px 8px #2196f355;
}
.tagline{
 margin-top:8px;
 color:var(--muted);
 font-size:15px;
 min-height:23px;
}
.tagline span{
 color:#7663ff;
 font-weight:800;
}
.typing-cursor{
 display:inline-block;
 width:2px;
 height:15px;
 background:#8065ff;
 margin-left:3px;
 vertical-align:-2px;
 animation:blink .7s infinite;
}
@keyframes blink{50%{opacity:0}}

/* SOCIAL */
.socials{
 display:flex;
 justify-content:center;
 gap:12px;
 margin-top:20px;
}
.social{
 width:55px;
 height:55px;
 display:grid;
 place-items:center;
 border-radius:19px;
 background:var(--card);
 box-shadow:var(--shadow);
 font-size:23px;
 transition:.3s;
}
.social:hover{transform:translateY(-7px) scale(1.05)}
.discord{color:#5865f2}
.telegram{color:#20a5e9}
.youtube{color:#ff2424}

/* NOTICE */
.notice{
 max-width:1200px;
 margin:0 auto 23px;
 padding:13px 18px;
 border-radius:15px;
 background:var(--card);
 box-shadow:var(--shadow);
 display:flex;
 align-items:center;
 gap:12px;
 font-size:12px;
 color:var(--muted);
}
.notice i,.notice strong{color:#7663ff}

/* APP LIST */
.container{
 width:100%;
 max-width:1660px;
 padding:0 14px;
 margin:auto;
}
.apps{
 display:grid;
 grid-template-columns:repeat(3,minmax(0,1fr));
 gap:18px;
}
.app-card{
 min-width:0;
 background:var(--card);
 border-radius:22px;
 overflow:hidden;
 box-shadow:var(--shadow);
 opacity:0;
 transform:translateY(25px);
 animation:showCard .7s ease forwards;
 transition:transform .3s,box-shadow .3s;
}
.app-card:hover{
 transform:translateY(-5px);
 box-shadow:0 18px 35px #0005;
}
@keyframes showCard{
 to{opacity:1;transform:translateY(0)}
}
.cover-wrap{
 width:100%;
 aspect-ratio:1.8/1;
 position:relative;
 overflow:hidden;
 background:#252638;
}
.app-cover{
 width:100%;
 height:100%;
 display:block;
 object-fit:cover;
 transition:transform .5s;
}
.app-card:hover .app-cover{transform:scale(1.035)}
.platform{
 position:absolute;
 top:9px;
 right:10px;
 padding:5px 12px;
 border-radius:20px;
 color:#fff;
 background:#171923dd;
 border:1px solid #ffffff55;
 font-size:10px;
 font-weight:800;
 backdrop-filter:blur(8px);
}
.platform.android{background:#16a34add}
.platform i{margin-right:4px}
.app-content{padding:0 15px 2px}
.app-heading{
 display:flex;
 align-items:center;
 gap:10px;
 margin-top:-28px;
 position:relative;
 min-height:62px;
}
.app-icon{
 width:64px;
 height:64px;
 flex:0 0 64px;
 object-fit:cover;
 border-radius:17px;
 border:3px solid var(--card);
 background:var(--card);
 box-shadow:0 4px 12px #0002;
}
.app-details{
 min-width:0;
 padding-top:24px;
}
.app-name{
 font-size:13px;
 font-weight:800;
 line-height:1.45;
 color:var(--text);
 overflow-wrap:anywhere;
}
.app-date{
 font-size:10px;
 color:var(--muted);
 font-style:italic;
 font-weight:600;
 margin-top:3px;
}
.app-description{
 color:var(--muted);
 font-size:10px;
 margin-top:8px;
 min-height:17px;
 line-height:1.6;
}

/* DOWNLOAD */
.download{
 width:100%;
 min-height:43px;
 display:flex;
 justify-content:center;
 align-items:center;
 gap:9px;
 border-radius:30px;
 margin:11px 0 13px;
 color:white;
 font-size:12px;
 font-weight:800;
 background:linear-gradient(100deg,#6265ff,#c03ef3);
 box-shadow:0 5px 16px #8750ff33;
 transition:.25s;
}
.download:hover{
 transform:translateY(-3px);
 box-shadow:0 9px 23px #8750ff55;
 filter:brightness(1.08);
}
.download:active{transform:scale(.98)}

/* MUSIC */
.bottom{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:16px;
 margin:25px 0 20px;
}
.panel{
 min-width:0;
 background:var(--card);
 border-radius:21px;
 padding:16px;
 box-shadow:var(--shadow);
}
.music{
 display:flex;
 align-items:center;
 gap:12px;
}
.music-cover{
 width:62px;
 height:62px;
 border-radius:50%;
 object-fit:cover;
 border:2px solid #ff843e;
 flex-shrink:0;
}
.music-content{flex:1;min-width:0}
.music-title{
 font-size:12px;
 font-weight:800;
 overflow:hidden;
 white-space:nowrap;
 text-overflow:ellipsis;
}
.music-artist{
 color:var(--muted);
 font-size:10px;
 margin-top:5px;
}
.music-controls{
 display:flex;
 gap:7px;
 align-items:center;
}
.music-controls button{
 width:32px;
 height:32px;
 border:1px solid #414365;
 background:#292b42;
 color:#a99aff;
 border-radius:50%;
 font-size:11px;
 transition:.2s;
}
.light .music-controls button{
 background:#f0f1ff;
 border-color:#dce0ff;
 color:#7864ff;
}
.music-controls button:hover{transform:scale(1.12)}
.progress-area{
 display:flex;
 align-items:center;
 gap:9px;
 margin-top:10px;
 font-size:9px;
 color:var(--muted);
}
.progress{
 flex:1;
 min-width:0;
 height:4px;
 accent-color:#8061ff;
 cursor:pointer;
}

/* YOUTUBE */
.youtube-panel{
 display:flex;
 align-items:center;
 gap:13px;
}
.youtube-avatar{
 width:62px;
 height:62px;
 border-radius:50%;
 object-fit:cover;
 flex-shrink:0;
}
.youtube-info{flex:1;min-width:0}
.youtube-info h3{font-size:14px}
.youtube-info p{
 color:var(--muted);
 font-size:10px;
 margin-top:4px;
}
.subscribe{
 background:#111;
 color:white;
 padding:11px 21px;
 border-radius:30px;
 font-size:11px;
 font-weight:800;
 white-space:nowrap;
 transition:.2s;
}
.subscribe:hover{background:#ff2020;transform:scale(1.04)}

/* FOOTER */
footer{
 text-align:center;
 padding:19px 10px;
 color:var(--muted);
 border-top:1px solid #ffffff15;
 font-size:11px;
}
footer span{color:#8065ff;font-weight:800}

/* TOAST */
.toast{
 position:fixed;
 bottom:25px;
 left:50%;
 transform:translate(-50%,100px);
 opacity:0;
 background:#202131;
 color:white;
 padding:12px 22px;
 border-radius:30px;
 font-size:12px;
 z-index:200;
 transition:.3s;
 text-align:center;
 max-width:90%;
}
.toast.show{
 transform:translate(-50%,0);
 opacity:1;
}

/* RESPONSIVE */
@media(max-width:950px){
 .apps{grid-template-columns:repeat(2,minmax(0,1fr))}
 .notice{margin-left:14px;margin-right:14px}
}
@media(max-width:600px){
 .navbar{height:49px;padding:0 13px}
 .hero{padding:30px 12px 35px}
 .avatar-wrap{width:130px;height:130px}
 .avatar{width:82px;height:82px;top:54%}
 .avatar-frame{width:130px;height:130px}
 .hero h1{font-size:21px}
 .social{width:48px;height:48px;border-radius:16px}
 .notice{margin:0 10px 18px;font-size:11px;padding:12px}
 .container{padding:0 10px}
 .apps{grid-template-columns:1fr;gap:15px}
 .cover-wrap{aspect-ratio:1.7/1}
 .app-name{font-size:13px}
 .bottom{grid-template-columns:1fr;gap:12px;margin-top:18px}
 .panel{padding:13px}
 .youtube-avatar{width:55px;height:55px}
 .subscribe{padding:10px 15px}
 .particle{font-size:12px!important}
}
@media(prefers-reduced-motion:reduce){
 *,*:before,*:after{
  animation-duration:.01ms!important;
  animation-iteration-count:1!important;
  scroll-behavior:auto!important;
 }
}
 
</style>
</head>

<body>
<div id="particles"></div>

<header class="navbar">

<section class="hero">

  <img class="avatar-frame"

   alt="" aria-hidden="true">

  Hoàng Kun iOS
  <span class="verified"><i class="fa-solid fa-check"></i></span>

  and I'm a <span id="typingText">Gamer</span><span class="typing-cursor"></span>

<main class="container">
 <section class="apps" id="appList"></section>

 <section class="bottom">
  <div class="panel">
   <div class="music">
    <img class="music-cover" src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=300&h=300&fit=crop" alt="Music">

    <div class="music-content">
     <div class="music-title" id="musicTitle">HOÀNG KUN MUSIC</div>

    </div>

    <div class="music-controls">

     <button onclick="toggleMusic()" id="playBtn" aria-label="Phát nhạc"><i class="fa-solid fa-play"></i></button>

   <audio id="audio" preload="metadata"></audio>
  </div>

  <div class="panel youtube-panel">
   <img class="youtube-avatar" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=200&h=200&fit=crop&crop=faces" alt="Hoàng Kun">

   <div class="youtube-info">
    <h3>Hoàng Kun Music</h3>
    <p>@KunMusic06</p>
    <p>Welcome to my channel!</p>
   </div>

   <a class="subscribe" href="https://www.youtube.com/@KunMusic06" target="_blank" rel="noopener">Đăng ký</a>
  </div>
 </section>
</main>

<footer>© Designer by <span>HOÀNG KUN iOS</span> 2026</footer>
<div class="toast" id="toast"></div>

<script>
/* DANH SÁCH ỨNG DỤNG */
const apps=[
 {
  name:"MENU AOV MAP V1",
  date:"30/10/2026",
  description:"Phiên bản AOV MAP dành cho Android",
  platform:"iOS",
  cover:"https://images.unsplash.com/photo-1511512578047-dfb367046420?w=1000&h=560&fit=crop",
  icon:"https://images.unsplash.com/photo-1612287230202-1ff1d85d1bdf?w=200&h=200&fit=crop",
  link:""
 },
 {
  name:"MENU AOV MAP V2",
  date:"31/10/2026",
  description:"Phiên bản cập nhật mới nhất",
  platform:"iOS",
  cover:"https://images.unsplash.com/photo-1542751371-adc38448a05e?w=1000&h=560&fit=crop",
  icon:"https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=200&h=200&fit=crop",
  link:""
 },
 {
  name:"MENU AOV ESP V3",
  date:"01/11/2026",
  description:"Phiên bản menu AOV mới",
  platform:"iOS",
  cover:"https://images.unsplash.com/photo-1560253023-3ec5d502959f?w=1000&h=560&fit=crop",
  icon:"https://images.unsplash.com/photo-1560253023-3ec5d502959f?w=200&h=200&fit=crop",
  link:""
 },
 {
  name:"MENU FREE FIRE",
  date:"27/10/2026",
  description:"Phiên bản hỗ trợ Free Fire",
  platform:"Android",
  cover:"https://images.unsplash.com/photo-1603481546238-487240415921?w=1000&h=560&fit=crop",
  icon:"https://images.unsplash.com/photo-1560253023-3ec5d502959f?w=200&h=200&fit=crop",
  link:""
 },
 {
  name:"MENU HỖ TRỢ GAME",
  date:"28/10/2026",
  description:"Công cụ hỗ trợ chơi game",
  platform:"Android",
  cover:"https://images.unsplash.com/photo-1542751371-adc38448a05e?w=1000&h=560&fit=crop",
  icon:"https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=200&h=200&fit=crop",
  link:""
 },
 {
  name:"TIKTOK MOD",
  date:"29/10/2026",
  description:"Phiên bản TikTok tùy chỉnh",
  platform:"iOS",
  cover:"https://images.unsplash.com/photo-1611162617474-5b21e879e113?w=1000&h=560&fit=crop",
  icon:"https://images.unsplash.com/photo-1611162616305-c69b3fa7fbe0?w=200&h=200&fit=crop",
  link:""
 }
];

/* HIỂN THỊ ỨNG DỤNG */
function renderApps(){
 const list=document.getElementById("appList");

 list.innerHTML=apps.map((app,index)=>`
  <article class="app-card" style="animation-delay:${index*.1}s">
   <div class="cover-wrap">
    <img class="app-cover" src="${app.cover}" alt="${app.name}" loading="lazy">
    <span class="platform ${app.platform.toLowerCase()==="android"?"android":""}">
     <i class="fa-brands ${app.platform.toLowerCase()==="android"?"fa-android":"fa-apple"}"></i>
     ${app.platform}
    </span>
   </div>

   <div class="app-content">
    <div class="app-heading">
     <img class="app-icon" src="${app.icon}" alt="${app.name}" loading="lazy">
     <div class="app-details">
      <div class="app-name">${app.name}</div>
      <div class="app-date">Cập Nhật Ngày ${app.date}</div>
     </div>
    </div>

    <p class="app-description">${app.description}</p>

    <a class="download" href="${app.link||"#"}" onclick="return downloadApp(event,${index})">
     <i class="fa-solid fa-download"></i> Download
    </a>
   </div>
  </article>
 `).join("");
}

function downloadApp(event,index){
 if(!apps[index].link){
  event.preventDefault();
  showToast("Ứng dụng chưa có link tải!");
  return false;
 }
 return true;
}

/* CHỮ CHẠY */
const words=["Gamer","YouTuber","TikToker","Developer"];
let wordIndex=0,charIndex=0,deleting=false;
const typingText=document.getElementById("typingText");

function typeWriter(){
 const word=words[wordIndex];

 if(!deleting){
  charIndex++;
  typingText.textContent=word.substring(0,charIndex);

  if(charIndex===word.length){
   deleting=true;
   setTimeout(typeWriter,1400);
   return;
  }
 }else{
  charIndex--;
  typingText.textContent=word.substring(0,charIndex);

  if(charIndex===0){
   deleting=false;
   wordIndex=(wordIndex+1)%words.length;
  }
 }

 setTimeout(typeWriter,deleting?65:115);
}

/* SAO RƠI */
function createParticles(){
 const area=document.getElementById("particles");
 const symbols=["✦","✧","·","✺","❋"];
 const colors=["#8d85ff","#ff9bcf","#79dfff","#a4e9bd"];
 const count=window.innerWidth<600?14:28;

 for(let i=0;i<count;i++){
  const p=document.createElement("span");
  p.className="particle";
  p.textContent=symbols[Math.floor(Math.random()*symbols.length)];
  p.style.left=Math.random()*100+"%";
  p.style.fontSize=(8+Math.random()*11)+"px";
  p.style.color=colors[Math.floor(Math.random()*colors.length)];
  p.style.animationDuration=(9+Math.random()*13)+"s";
  p.style.animationDelay=(-Math.random()*18)+"s";
  p.style.setProperty("--drift",(Math.random()*140-70)+"px");
  area.appendChild(p);
 }
}

/* DARK MODE */
function toggleTheme(){
 document.body.classList.toggle("light");
 const light=document.body.classList.contains("light");

 document.getElementById("themeBtn").innerHTML=light
  ?'<i class="fa-solid fa-moon"></i>'
  :'<i class="fa-solid fa-sun"></i>';
}

/* TOAST */
let toastTimer;
function showToast(message){
 const toast=document.getElementById("toast");
 toast.textContent=message;
 toast.classList.add("show");
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>toast.classList.remove("show"),2500);
}

/* MUSIC PLAYER */
const tracks=[
 {title:"HOÀNG KUN MUSIC",artist:"Playlist yêu thích",src:"music.mp3"}
];

let trackIndex=0;
const audio=document.getElementById("audio");
const playBtn=document.getElementById("playBtn");
const progress=document.getElementById("progress");

function loadTrack(){
 const track=tracks[trackIndex];
 audio.src=track.src;
 document.getElementById("musicTitle").textContent=track.title;
 document.getElementById("musicArtist").textContent=track.artist;
 progress.value=0;
 document.getElementById("currentTime").textContent="0:00";
 document.getElementById("duration").textContent="0:00";
}

function toggleMusic(){
 if(audio.paused){
  audio.play().catch(()=>showToast("Kiểm tra file music.mp3 nhé!"));
 }else{
  audio.pause();
 }
}

function changeTrack(direction){
 trackIndex=(trackIndex+direction+tracks.length)%tracks.length;
 loadTrack();
 toggleMusic();
}

function formatTime(seconds){
 if(!Number.isFinite(seconds))return "0:00";
 return Math.floor(seconds/60)+":"+String(Math.floor(seconds%60)).padStart(2,"0");
}

audio.addEventListener("loadedmetadata",()=>{
 document.getElementById("duration").textContent=formatTime(audio.duration);
});

audio.addEventListener("timeupdate",()=>{
 if(!audio.duration)return;
 progress.value=audio.currentTime/audio.duration*100;
 document.getElementById("currentTime").textContent=formatTime(audio.currentTime);
});

progress.addEventListener("input",()=>{
 if(audio.duration)audio.currentTime=progress.value/100*audio.duration;
});

audio.addEventListener("play",()=>{
 playBtn.innerHTML='<i class="fa-solid fa-pause"></i>';
});

audio.addEventListener("pause",()=>{
 playBtn.innerHTML='<i class="fa-solid fa-play"></i>';
});

audio.addEventListener("ended",()=>{
 playBtn.innerHTML='<i class="fa-solid fa-play"></i>';
});

/* KHỞI CHẠY */
renderApps();
createParticles();
loadTrack();
typeWriter();
</script>
</body>
</html>
