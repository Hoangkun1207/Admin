
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f8ff">
<title>Hoàng Kun iOS | App Library</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root{
 --bg:#f6f7fc;
 --card:#ffffff;
 --text:#17182b;
 --muted:#9299ad;
 --primary:#655fff;
 --shadow:0 9px 28px rgba(38,48,90,.12);
 --border:rgba(120,130,170,.12);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
 font-family:'Be Vietnam Pro',sans-serif;
 background:var(--bg);
 color:var(--text);
 min-height:100vh;
 overflow-x:hidden;
 transition:.3s;
}
body.dark{
 --bg:#10111b;
 --card:#1b1d2b;
 --text:#f4f5ff;
 --muted:#a1a5ba;
 --shadow:0 9px 30px rgba(0,0,0,.3);
 --border:rgba(255,255,255,.08);
}
body:before{
 content:"";
 position:fixed;
 width:650px;height:650px;
 top:-300px;left:50%;
 transform:translateX(-50%);
 background:radial-gradient(circle,rgba(117,130,255,.16),transparent 70%);
 pointer-events:none;
 z-index:-1;
}
button,a{font:inherit}
a{text-decoration:none;color:inherit}

/* NAVBAR */
.navbar{
 height:53px;
 position:sticky;
 top:0;
 z-index:100;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 25px;
 background:rgba(255,255,255,.7);
 backdrop-filter:blur(20px);
 border-bottom:1px solid var(--border);
}
.dark .navbar{background:rgba(20,21,34,.75)}
.nav-btn{
 border:0;
 background:transparent;
 font-size:18px;
 cursor:pointer;
 padding:9px;
 transition:.25s;
}
.nav-btn:hover{transform:scale(1.15)}
.bell{color:#6075ff}
.theme{color:#ff9e00}

/* HERO */
.hero{
 text-align:center;
 padding:42px 15px 47px;
}
.avatar{
 width:112px;height:112px;
 border-radius:35px;
 object-fit:cover;
 border:4px solid var(--card);
 box-shadow:var(--shadow);
}
.hello{
 color:var(--muted);
 font-size:13px;
 margin-top:12px;
}
.hero h1{
 font-size:23px;
 font-weight:800;
 margin-top:5px;
}
.verified{color:#2196f3;font-size:17px}
.tagline{
 color:var(--muted);
 font-size:14px;
 margin-top:7px;
}
.tagline span{color:#7965ff;font-weight:700}
.socials{
 display:flex;
 justify-content:center;
 gap:12px;
 margin-top:19px;
}
.social{
 width:56px;height:56px;
 display:grid;
 place-items:center;
 border-radius:19px;
 background:var(--card);
 box-shadow:var(--shadow);
 font-size:23px;
 transition:.3s;
}
.social:hover{transform:translateY(-5px)}
.discord{color:#5865f2}
.telegram{color:#20a5e9}
.youtube{color:#ff2525}

/* NOTICE */
.notice{
 max-width:1200px;
 margin:0 auto 25px;
 padding:13px 18px;
 border-radius:15px;
 background:var(--card);
 box-shadow:var(--shadow);
 display:flex;
 align-items:center;
 gap:12px;
 font-size:13px;
}
.notice i{color:#6075ff;font-size:18px}
.notice strong{color:#7865ff}

/* APP GRID */
.container{
 width:100%;
 max-width:1660px;
 padding:0 14px;
 margin:auto;
}
.apps{
 display:grid;
 grid-template-columns:repeat(3,minmax(0,1fr));
 gap:18px;
}
.app-card{
 background:var(--card);
 border-radius:23px;
 overflow:hidden;
 box-shadow:var(--shadow);
 border:1px solid var(--border);
 transition:transform .3s,box-shadow .3s;
 animation:appear .65s both;
}
.app-card:hover{
 transform:translateY(-5px);
 box-shadow:0 15px 35px rgba(72,77,160,.17);
}
@keyframes appear{
 from{opacity:0;transform:translateY(22px)}
 to{opacity:1;transform:translateY(0)}
}
.app-cover{
 width:100%;
 aspect-ratio:1.8/1;
 object-fit:cover;
 display:block;
 background:#25253c;
}
.app-info{
 padding:0 16px;
}
.app-heading{
 display:flex;
 align-items:center;
 gap:11px;
 margin-top:-28px;
 position:relative;
}
.app-icon{
 width:65px;height:65px;
 border-radius:17px;
 object-fit:cover;
 border:3px solid var(--card);
 background:var(--card);
 box-shadow:0 3px 12px rgba(0,0,0,.12);
}
.app-name{
 font-size:13px;
 font-weight:700;
 line-height:1.5;
}
.app-date{
 color:var(--muted);
 font-size:10px;
 font-style:italic;
 margin-top:3px;
}
.app-description{
 font-size:11px;
 color:var(--muted);
 margin-top:9px;
 min-height:16px;
}
.download{
 width:100%;
 height:43px;
 border-radius:30px;
 display:flex;
 align-items:center;
 justify-content:center;
 gap:9px;
 margin:12px 0 15px;
 color:#fff;
 font-size:12px;
 font-weight:700;
 background:linear-gradient(100deg,#6266ff,#c13ff5);
 box-shadow:0 5px 13px rgba(125,83,255,.18);
 transition:.25s;
}
.download:hover{
 filter:brightness(1.08);
 transform:scale(1.015);
 box-shadow:0 7px 20px rgba(125,83,255,.35);
}
.download:active{transform:scale(.97)}

/* BOTTOM AREA */
.bottom{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:17px;
 margin:25px 0 20px;
}
.panel{
 background:var(--card);
 border-radius:22px;
 padding:17px;
 box-shadow:var(--shadow);
 border:1px solid var(--border);
}
.music{
 display:flex;
 align-items:center;
 gap:14px;
}
.music-cover{
 width:66px;height:66px;
 border-radius:50%;
 object-fit:cover;
 border:2px solid #ff792e;
}
.music-content{flex:1;min-width:0}
.music-title{
 font-size:13px;
 font-weight:700;
}
.music-artist{
 font-size:10px;
 color:var(--muted);
 margin-top:5px;
}
.music-controls{
 display:flex;
 align-items:center;
 gap:8px;
}
.music-controls button{
 border:1px solid #d9ddff;
 color:#7665ff;
 background:#f0f1ff;
 width:32px;height:32px;
 border-radius:50%;
 cursor:pointer;
}
.music-controls button:hover{background:#dedfff}
.progress-area{
 display:flex;
 align-items:center;
 gap:10px;
 margin-top:10px;
 font-size:9px;
 color:var(--muted);
}
.progress{
 flex:1;
 height:4px;
 border-radius:10px;
 accent-color:#8061ff;
 cursor:pointer;
}
.youtube-panel{
 display:flex;
 align-items:center;
 gap:14px;
}
.youtube-avatar{
 width:68px;height:68px;
 border-radius:50%;
 object-fit:cover;
}
.youtube-info{flex:1;min-width:0}
.youtube-info h3{font-size:15px}
.youtube-info p{
 color:var(--muted);
 font-size:11px;
 margin-top:5px;
}
.subscribe{
 background:#111;
 color:white;
 border-radius:30px;
 padding:11px 23px;
 font-size:11px;
 font-weight:700;
 white-space:nowrap;
}

/* FOOTER */
footer{
 text-align:center;
 border-top:1px solid var(--border);
 padding:19px 10px;
 color:var(--muted);
 font-size:11px;
}
footer span{color:#8170ff}

/* TOAST */
.toast{
 position:fixed;
 bottom:25px;
 left:50%;
 transform:translate(-50%,100px);
 opacity:0;
 background:#202131;
 color:white;
 padding:12px 22px;
 border-radius:30px;
 font-size:12px;
 z-index:200;
 transition:.35s;
 box-shadow:var(--shadow);
}
.toast.show{
 transform:translate(-50%,0);
 opacity:1;
}

/* RESPONSIVE */
@media(max-width:950px){
 .apps{grid-template-columns:repeat(2,minmax(0,1fr))}
 .notice{margin-left:14px;margin-right:14px}
}
@media(max-width:600px){
 .navbar{height:49px;padding:0 14px}
 .hero{padding:30px 12px 35px}
 .avatar{width:96px;height:96px;border-radius:29px}
 .hero h1{font-size:20px}
 .social{width:48px;height:48px}
 .container{padding:0 10px}
 .apps{grid-template-columns:1fr;gap:15px}
 .app-cover{aspect-ratio:1.65/1}
 .app-name{font-size:13px}
 .app-icon{width:60px;height:60px}
 .bottom{grid-template-columns:1fr;gap:13px}
 .panel{padding:14px}
 .youtube-avatar{width:58px;height:58px}
 .subscribe{padding:10px 15px}
}
</style>
</head>

<body>

<!-- THANH MENU -->
<header class="navbar">
 <button class="nav-btn bell" onclick="showToast('Chào mừng đến với Hoàng Kun iOS!')">
  <i class="fa-solid fa-bell"></i>
 </button>
 <button class="nav-btn theme" id="themeBtn" onclick="toggleTheme()">
  <i class="fa-solid fa-sun"></i>
 </button>
</header>

<!-- THÔNG TIN CÁ NHÂN -->
<section class="hero">
 <img class="avatar"
 src="https://i.pravatar.cc/300?img=12"
 alt="Hoàng Kun">

 <p class="hello">Hi, i am</p>
 <h1>Hoàng Kun <i class="fa-solid fa-circle-check verified"></i></h1>
 <p class="tagline">and I'm a <span>Developer.</span></p>

 <div class="socials">
  <a class="social discord" href="#" title="Discord">
   <i class="fa-brands fa-discord"></i>
  </a>
  <a class="social telegram" href="#" title="Telegram">
   <i class="fa-brands fa-telegram"></i>
  </a>
  <a class="social youtube" href="#" title="YouTube">
   <i class="fa-brands fa-youtube"></i>
  </a>
 </div>
</section>

<!-- THÔNG BÁO -->
<div class="notice">
 <i class="fa-solid fa-bullhorn"></i>
 <div><strong>THÔNG BÁO:</strong> Chào mừng bạn đến với hệ thống Hoàng Kun iOS!</div>
</div>

<!-- DANH SÁCH ỨNG DỤNG -->
<main class="container">
 <section class="apps" id="appList"></section>

 <!-- NHẠC VÀ YOUTUBE -->
 <section class="bottom">

  <div class="panel">
   <div class="music">
    <img class="music-cover"
     src="https://picsum.photos/200?random=20"
     alt="Music">
    <div class="music-content">
     <div class="music-title">HOÀNG KUN MUSIC</div>
     <div class="music-artist">Playlist yêu thích</div>
    </div>
    <div class="music-controls">
     <button onclick="changeTrack(-1)"><i class="fa-solid fa-backward-step"></i></button>
     <button onclick="toggleMusic()" id="playBtn"><i class="fa-solid fa-play"></i></button>
     <button onclick="changeTrack(1)"><i class="fa-solid fa-forward-step"></i></button>
    </div>
   </div>
   <div class="progress-area">
    <span id="currentTime">0:00</span>
    <input class="progress" id="progress" type="range" min="0" max="100" value="0">
    <span id="duration">0:00</span>
   </div>
   <audio id="audio"></audio>
  </div>

  <div class="panel youtube-panel">
   <img class="youtube-avatar"
    src="https://i.pravatar.cc/200?img=12"
    alt="Hoàng Kun">
   <div class="youtube-info">
    <h3>Hoàng Kun iOS</h3>
    <p>@HoangKun</p>
    <p>Welcome to my channel</p>
   </div>
   <a class="subscribe" href="https://youtube.com/" target="_blank">
    Đăng ký
   </a>
  </div>

 </section>
</main>

<footer>
 © Designer by <span>HOÀNG KUN iOS</span> 2026
</footer>

<div class="toast" id="toast"></div>

<script>
// =====================================
// DANH SÁCH ỨNG DỤNG
// Thay ảnh và link tải tại đây
// =====================================

const apps=[
 {
  name:"MENU AOV MAP ADR V1",
  date:"30/10/2026",
  description:"Phiên bản AOV MAP dành cho Android",
  cover:"https://picsum.photos/800/450?random=11",
  icon:"https://picsum.photos/150?random=11",
  link:"#"
 },
 {
  name:"MENU AOV MAP ADR V2",
  date:"31/10/2026",
  description:"Phiên bản cập nhật mới nhất",
  cover:"https://picsum.photos/800/450?random=12",
  icon:"https://picsum.photos/150?random=12",
  link:"#"
 },
 {
  name:"FREE FIRE CHEAT PROXY",
  date:"17/10/2026",
  description:"Ứng dụng hỗ trợ Free Fire",
  cover:"https://picsum.photos/800/450?random=13",
  icon:"https://picsum.photos/150?random=13",
  link:"#"
 },
 {
  name:"8 BALL POOL",
  date:"26/10/2026",
  description:"Ứng dụng 8 Ball Pool",
  cover:"https://picsum.photos/800/450?random=14",
  icon:"https://picsum.photos/150?random=14",
  link:"#"
 },
 {
  name:"TIKTOK MOD",
  date:"27/10/2026",
  description:"Phiên bản TikTok tùy chỉnh",
  cover:"https://picsum.photos/800/450?random=15",
  icon:"https://picsum.photos/150?random=15",
  link:"#"
 }
];

// HIỂN THỊ CARD
function renderApps(){
 const list=document.getElementById("appList");

 list.innerHTML=apps.map((app,index)=>`
  <article class="app-card" style="animation-delay:${index*.08}s">
   <img class="app-cover"
    src="${app.cover}"
    alt="${app.name}"
    loading="lazy">

   <div class="app-info">
    <div class="app-heading">
     <img class="app-icon"
      src="${app.icon}"
      alt="${app.name}">
     <div>
      <div class="app-name">${app.name}</div>
      <div class="app-date">Cập Nhật Ngày ${app.date}</div>
     </div>
    </div>

    <p class="app-description">${app.description}</p>

    <a class="download"
     href="${app.link}"
     target="_blank"
     rel="noopener noreferrer"
     onclick="return checkDownload(event,this)">
     <i class="fa-solid fa-download"></i>
     Download
    </a>
   </div>
  </article>
 `).join("");
}

function checkDownload(event,element){
 if(element.getAttribute("href")==="#"){
  event.preventDefault();
  showToast("Bạn chưa thêm link tải ứng dụng!");
  return false;
 }
 return true;
}

// CHUYỂN SÁNG / TỐI
function toggleTheme(){
 document.body.classList.toggle("dark");
 const dark=document.body.classList.contains("dark");
 document.getElementById("themeBtn").innerHTML=
 dark?'<i class="fa-solid fa-moon"></i>':
 '<i class="fa-solid fa-sun"></i>';
}

// THÔNG BÁO
let toastTimer;
function showToast(message){
 const toast=document.getElementById("toast");
 toast.textContent=message;
 toast.classList.add("show");
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>toast.classList.remove("show"),2500);
}

// =====================================
// MUSIC PLAYER
// Đặt nhạc trong thư mục music.mp3
// =====================================

const tracks=["music.mp3"];
let trackIndex=0;

const audio=document.getElementById("audio");
const playBtn=document.getElementById("playBtn");
const progress=document.getElementById("progress");

function loadTrack(){
 audio.src=tracks[trackIndex];
}
function toggleMusic(){
 if(audio.paused){
  audio.play().then(()=>{
   playBtn.innerHTML='<i class="fa-solid fa-pause"></i>';
  }).catch(()=>showToast("Không thể phát nhạc!"));
 }else{
  audio.pause();
  playBtn.innerHTML='<i class="fa-solid fa-play"></i>';
 }
}
function changeTrack(direction){
 trackIndex=(trackIndex+direction+tracks.length)%tracks.length;
 loadTrack();
 audio.play().then(()=>{
  playBtn.innerHTML='<i class="fa-solid fa-pause"></i>';
 }).catch(()=>showToast("Không thể phát nhạc!"));
}
function formatTime(seconds){
 if(!Number.isFinite(seconds))return "0:00";
 const m=Math.floor(seconds/60);
 const s=Math.floor(seconds%60).toString().padStart(2,"0");
 return `${m}:${s}`;
}
audio.addEventListener("timeupdate",()=>{
 if(audio.duration){
  progress.value=audio.currentTime/audio.duration*100;
  document.getElementById("currentTime").textContent=formatTime(audio.currentTime);
  document.getElementById("duration").textContent=formatTime(audio.duration);
 }
});
progress.addEventListener("input",()=>{
 if(audio.duration){
  audio.currentTime=progress.value/100*audio.duration;
 }
});
audio.addEventListener("ended",()=>{
 playBtn.innerHTML='<i class="fa-solid fa-play"></i>';
});

// KHỞI CHẠY
renderApps();
loadTrack();
</script>

</body>
</html>
